appId: com.dios.app
productName: DIOS
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
  artifactName: DIOS-설치.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - ko_KR
  language: 1042
