appId: com.dios.app
productName: DIOS
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
  # ASCII name so the GitHub release asset and latest.yml agree on every computer.
  artifactName: DIOS-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - ko_KR
  language: 1042
publish:
  provider: github
  owner: ju0o
  repo: Dios
  releaseType: release
releaseInfo:
  releaseNotesFile: release-notes.md
