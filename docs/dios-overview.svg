<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">DIOS local-first workspace overview</title>
  <desc id="desc">DIOS keeps local AI usage, projects, documents, skills, experiments, and human gates in one desktop workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#a5b4fc"/></marker>
  </defs>
  <rect width="1100" height="420" rx="24" fill="url(#bg)"/>
  <text x="55" y="58" fill="#eef2ff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">DIOS · Local-first AI workspace</text>
  <text x="55" y="88" fill="#c7d2fe" font-family="Segoe UI,Arial,sans-serif" font-size="16">Monitor agents, organize project knowledge, and keep decisions on the desktop.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="210" height="70" rx="14" fill="#374151"/><rect x="55" y="260" width="210" height="70" rx="14" fill="#374151"/>
    <rect x="370" y="125" width="300" height="225" rx="20" fill="url(#core)"/>
    <rect x="775" y="145" width="270" height="70" rx="14" fill="#374151"/><rect x="775" y="260" width="270" height="70" rx="14" fill="#374151"/>
  </g>
  <g fill="none" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"><path d="M265 180h95"/><path d="M265 295h95"/><path d="M670 180h95"/><path d="M670 295h95"/></g>
  <g fill="#f9fafb" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="160" y="174" font-size="19" font-weight="700">AI usage</text><text x="160" y="198" font-size="14" fill="#d1d5db">local session + API views</text>
    <text x="160" y="289" font-size="19" font-weight="700">Project files</text><text x="160" y="313" font-size="14" fill="#d1d5db">docs, skills, resources</text>
    <text x="520" y="210" font-size="25" font-weight="700">DIOS Desktop</text><text x="520" y="246" font-size="16" fill="#e0e7ff">SQLite · Electron · React</text><text x="520" y="278" font-size="16" fill="#e0e7ff">scan · search · visualize</text><text x="520" y="310" font-size="16" fill="#e0e7ff">human-gated decisions</text>
    <text x="910" y="174" font-size="19" font-weight="700">Experiments</text><text x="910" y="198" font-size="14" fill="#d1d5db">states + decision records</text>
    <text x="910" y="289" font-size="19" font-weight="700">Privacy boundary</text><text x="910" y="313" font-size="14" fill="#d1d5db">local-first data handling</text>
  </g>
</svg>
