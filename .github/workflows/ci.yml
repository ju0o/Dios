name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build native sqlite for Node
        run: npm rebuild better-sqlite3
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build renderer
        run: npm run build:renderer
